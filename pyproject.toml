[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchwork"
version = "0.1.0"
description = "An AI engineering control plane: planner, builder, tester and reviewer agents with guardrails and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
patchwork = "patchwork.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]
extend-exclude = ["sample_ads_platform"]
